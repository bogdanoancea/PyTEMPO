name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: read-all

env:
  # The live-service tests stay off in CI: a failure there would mean the
  # TEMPO Online service changed, not that this commit broke anything.
  TEMPO_LIVE_TESTS: "false"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

  pandas-versions:
    name: pandas ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported pandas, with the numpy it was built against.
          - label: "2.0 (oldest supported)"
            python-version: "3.10"
            pandas: "==2.0.3"
            numpy: "<2"
          - label: "2.x (latest)"
            python-version: "3.12"
            pandas: ">=2,<3"
            numpy: ""
          - label: "3.x (latest)"
            python-version: "3.12"
            pandas: ">=3"
            numpy: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "pandas${{ matrix.pandas }}" "numpy${{ matrix.numpy }}"
      - name: Show versions
        run: python -c "import pandas, numpy; print(pandas.__version__, numpy.__version__)"
      - name: Test
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
